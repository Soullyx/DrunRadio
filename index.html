<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Музыкальный Плеер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JN7X4FDTF0"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-JN7X4FDTF0');
</script>
    <!-- Фоновый блок сохранен -->
    <div class="bg-effects" id="bg-effects">
        <img src="Drunradio.png" alt="Фон" class="bg-photo">
        <div class="bg-overlay"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <!-- Полноэкранный рабочий контейнер плеера -->
    <div class="app-container">
        
        <!-- ВЕРХНЯЯ ШАПКА С НАЗВАНИЕМ САЙТА -->
        <header class="main-header">
            <h1>DRUNRAdio</h1>
        </header>
        
        <!-- ЛЕВАЯ ПАНЕЛЬ: Управление и Плейлисты -->
        <aside class="sidebar">
            <div class="upload-section">
                <h4>Добавить свою музыку</h4>
                <label for="file-upload" class="custom-file-upload">
                    📁 Выбрать файлы .mp3
                </label>
                <input type="file" id="file-upload" accept="audio/mp3" multiple style="display:none;">
            </div>

            <div class="playlists-section">
                <h4>Мои Плейлисты</h4>
                <div class="create-playlist">
                    <input type="text" id="playlist-name" placeholder="Название...">
                    <button id="add-playlist-btn">＋</button>
                </div>
                <ul id="playlists-list">
                    <li class="active-playlist" data-type="all">Все треки</li>
                    <!-- Новые плейлисты добавятся сюда -->
                </ul>
            </div>
        </aside>

        <!-- ЦЕНТРАЛЬНАЯ ЧАСТЬ: Главный экран трека -->
        <main class="main-display">
            <div class="current-track-large">
                <div class="img-container-large">
                    <img src="https://placeholder.com" alt="Обложка трека" id="cover">
                </div>
                <h2 id="title">Название песни</h2>
                <h3 id="artist">Исполнитель</h3>
            </div>
        </main>

        <!-- ПРАВАЯ ПАНЕЛЬ: Текущий список песен -->
        <section class="right-panel">
            <div class="playlist-container">
                <h4 id="current-playlist-title">Все треки</h4>
                <ul id="playlist">
                    <!-- Сюда JS подгрузит песни -->
                </ul>
            </div>
        </section>

        <!-- НИЖНЯЯ ПАНЕЛЬ: Управление плеером -->
        <footer class="player-controls-bar">
            <!-- Аудио-элемент HTML5 -->
            <audio id="audio" src=""></audio>

            <!-- Кнопки -->
            <div class="navigation">
                <button id="loop" class="action-btn-small">🔁</button>
                <button id="prev" class="action-btn">⏮</button>
                <button id="play" class="action-btn action-btn-big">▶</button>
                <button id="next" class="action-btn">⏭</button>
            </div>

            <!-- Прогресс -->
            <div class="progress-block">
                <span id="current-time">0:00</span>
                <div class="progress-container" id="progress-container">
                    <div class="progress" id="progress"></div>
                </div>
                <span id="duration">0:00</span>
            </div>

            <!-- Громкость -->
            <div class="volume-container">
                <span>🔈</span>
                <input type="range" id="volume" min="0" max="1" step="0.05" value="0.7">
                <span>🔊</span>
            </div>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
